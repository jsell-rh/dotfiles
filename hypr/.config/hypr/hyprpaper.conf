# hyprpaper 0.8+ syntax (0.7 preload/wallpaper lines no longer parse).
# You can find more wallpapers in ~/.config/ml4w/wallpapers/
# Run ~/.config/ml4w/scripts/reload-hyprpaper.sh after changing your wallpaper
splash = false

wallpaper {
    monitor = *
    path = ~/.config/ml4w/wallpapers/mountain.jpg
    fit_mode = cover
}
